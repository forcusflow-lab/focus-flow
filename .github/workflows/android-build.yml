name: Build signed Android App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focus-flow-android-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: Build Google Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOCUS_FLOW_UPLOAD_STORE_FILE: focus-flow-upload.jks
      FOCUS_FLOW_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      FOCUS_FLOW_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      FOCUS_FLOW_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Generate the Android project
        run: CI=1 pnpm exec expo prebuild --platform android --clean

      - name: Restore the Google Play upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error title=Missing signing secret::ANDROID_KEYSTORE_BASE64 is required."; exit 1; }
          test -n "$FOCUS_FLOW_UPLOAD_STORE_PASSWORD" || { echo "::error title=Missing signing secret::ANDROID_KEYSTORE_PASSWORD is required."; exit 1; }
          test -n "$FOCUS_FLOW_UPLOAD_KEY_ALIAS" || { echo "::error title=Missing signing secret::ANDROID_KEY_ALIAS is required."; exit 1; }
          test -n "$FOCUS_FLOW_UPLOAD_KEY_PASSWORD" || { echo "::error title=Missing signing secret::ANDROID_KEY_PASSWORD is required."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/focus-flow-upload.jks
          chmod 600 android/app/focus-flow-upload.jks
          grep -q "FOCUS_FLOW_UPLOAD_STORE_FILE" android/app/build.gradle

      - name: Build signed release bundle
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: focus-flow-v7-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
