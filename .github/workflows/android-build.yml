name: Build signed Android App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focus-flow-android-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: Build Google Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOCUS_FLOW_UPLOAD_STORE_FILE: focus-flow-upload.jks
      FOCUS_FLOW_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      FOCUS_FLOW_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      FOCUS_FLOW_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_UPLOAD_CERT_SHA1: "0D:A5:A7:0E:14:A2:A4:3A:DB:A8:F8:04:40:81:C5:B2:18:86:B5:BC"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Generate the Android project
        run: CI=1 pnpm exec expo prebuild --platform android --clean

      - name: Restore the Google Play upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error title=Missing signing secret::ANDROID_KEYSTORE_BASE64 is required."; exit 1; }
          test -n "$FOCUS_FLOW_UPLOAD_STORE_PASSWORD" || { echo "::error title=Missing signing secret::ANDROID_KEYSTORE_PASSWORD is required."; exit 1; }
          test -n "$FOCUS_FLOW_UPLOAD_KEY_ALIAS" || { echo "::error title=Missing signing secret::ANDROID_KEY_ALIAS is required."; exit 1; }
          test -n "$FOCUS_FLOW_UPLOAD_KEY_PASSWORD" || { echo "::error title=Missing signing secret::ANDROID_KEY_PASSWORD is required."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/focus-flow-upload.jks
          chmod 600 android/app/focus-flow-upload.jks
          grep -q "FOCUS_FLOW_UPLOAD_STORE_FILE" android/app/build.gradle

      - name: Build signed release bundle
        working-directory: android
        run: |
          ./gradlew :app:bundleRelease --no-daemon --stacktrace \
            -PFOCUS_FLOW_UPLOAD_STORE_FILE="$FOCUS_FLOW_UPLOAD_STORE_FILE" \
            -PFOCUS_FLOW_UPLOAD_STORE_PASSWORD="$FOCUS_FLOW_UPLOAD_STORE_PASSWORD" \
            -PFOCUS_FLOW_UPLOAD_KEY_ALIAS="$FOCUS_FLOW_UPLOAD_KEY_ALIAS" \
            -PFOCUS_FLOW_UPLOAD_KEY_PASSWORD="$FOCUS_FLOW_UPLOAD_KEY_PASSWORD"

      - name: Verify Google Play upload certificate
        working-directory: android
        run: |
          unzip -p app/build/outputs/bundle/release/app-release.aab 'META-INF/*.RSA' > /tmp/focus-flow-signature.rsa
          openssl pkcs7 -inform DER -in /tmp/focus-flow-signature.rsa -print_certs -out /tmp/focus-flow-certificate.pem
          ACTUAL_UPLOAD_CERT_SHA1="$(openssl x509 -in /tmp/focus-flow-certificate.pem -noout -fingerprint -sha1 | cut -d= -f2)"
          test "$ACTUAL_UPLOAD_CERT_SHA1" = "$EXPECTED_UPLOAD_CERT_SHA1" || { echo "::error title=Unexpected upload certificate::Expected $EXPECTED_UPLOAD_CERT_SHA1 but found $ACTUAL_UPLOAD_CERT_SHA1"; exit 1; }
          echo "Verified Google Play upload certificate: $ACTUAL_UPLOAD_CERT_SHA1"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: focus-flow-v7-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
